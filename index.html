<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานเหตุการณ์กิจกรรมพิเศษ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  
  <!-- 1. โลโก้ปรับขนาดเล็กลง (เปลี่ยน max-width เป็น 250px) และจัดกึ่งกลาง -->
  <img src="LOGO.png" alt="โลโก้กองกายภาพและสิ่งแวดล้อม" style="display: block; margin: 0 auto 15px auto; max-width: 200px; height: auto;">
  
  <h2>แบบรายงานเหตุการณ์ <br><span style="font-size: 16px; font-weight: 300;">(กิจกรรมพิเศษ)</span></h2>
  
  <!-- 2. ปุ่มดูแดชบอร์ด เปลี่ยนจาก text-align: right; เป็น text-align: center; -->
  <div style="text-align: center; margin-bottom: 20px;">
    <a href="dashboard.html" class="dashboard-link-btn" style="text-decoration: none; padding: 8px 15px; background: #eef5f0; color: #207144; border-radius: 6px; font-size: 14px; font-weight: 500; border: 1px solid #207144; display: inline-block;">📊 ดูภาพรวมเหตุการณ์</a>
  </div>
  
  <form id="incidentForm">
    <!-- โค้ดส่วนอื่นๆ ของฟอร์มปล่อยไว้เหมือนเดิมครับ -->
    
    <div class="form-group autocomplete-container">
      <label class="field-label">1. ชื่อ นามสกุล *</label>
      <input type="text" id="name" required placeholder="พิมพ์เพื่อค้นหาชื่อ..." autocomplete="off">
      <div id="autocomplete-list" class="autocomplete-items"></div>
    </div>

    <div class="form-group">
      <label class="field-label">2. ตำแหน่ง *</label>
      <input type="text" id="position" required placeholder="กรอกตำแหน่งของคุณ">
    </div>

    <div class="form-group">
      <label class="field-label">3. หน่วยงาน *</label>
      <input type="text" id="department" required placeholder="กรอกหน่วยงาน/สังกัด">
    </div>

    <!-- ย้ายประเภทเหตุการณ์มาเป็นข้อ 4 -->
    <div class="form-group">
      <label class="field-label">4. ประเภทเหตุการณ์ *</label>
      <div class="severity-group">
        <div class="severity-option">
          <input type="radio" id="cat1" name="category" value="ด้านจราจร/และความปลอดภัย" required>
          <label for="cat1">ด้านจราจร/และความปลอดภัย</label>
        </div>
        <div class="severity-option">
          <input type="radio" id="cat2" name="category" value="การจัดการร้านค้า">
          <label for="cat2">การจัดการร้านค้า</label>
        </div>
        <div class="severity-option">
          <input type="radio" id="cat3" name="category" value="อื่นๆ">
          <label for="cat3">อื่นๆ</label>
        </div>
      </div>
      <!-- กล่องข้อความจะแสดงก็ต่อเมื่อเลือก "อื่นๆ" -->
      <input type="text" id="otherCategory" placeholder="โปรดระบุประเภทเหตุการณ์..." style="display: none; margin-top: 10px; width: 100%; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px;">
    </div>

    <!-- ย้ายระดับความรุนแรงมาเป็นข้อ 5 -->
    <div class="form-group">
      <label class="field-label">5. ระดับความรุนแรงของเหตุการณ์ *</label>
      <div class="severity-group">
        <div class="severity-option">
  <!-- เปลี่ยน value เป็น เหตุการณ์ปกติ -->
  <input type="radio" id="sev1" name="severity" value="เหตุการณ์ปกติ" required>
  <label for="sev1">ปกติ</label>
</div>
        <div class="severity-option">
          <input type="radio" id="sev2" name="severity" value="อาจเกิดอันตรายได้">
          <label for="sev2" class="warning">อาจเกิดอันตรายได้</label>
        </div>
        <div class="severity-option">
          <input type="radio" id="sev3" name="severity" value="อันตรายมากต้องแก้ไข">
          <label for="sev3" class="danger">อันตรายมากต้องแก้ไข</label>
        </div>
      </div>
    </div>

    <!-- ย้ายสถานที่เกิดเหตุลงมาเป็นข้อ 6 -->
    <div class="form-group">
      <label class="field-label">6. สถานที่เกิดเหตุ *</label>
      <input type="text" id="location" required placeholder="ระบุสถานที่เกิดเหตุ">
    </div>

    <div class="form-group">
      <label class="field-label">7. รายละเอียดเพิ่มเติม</label>
      <textarea id="details" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
    </div>

    <div class="form-group">
      <label class="field-label">8. แนบรูปภาพ (สูงสุด 3 รูป) *</label>
      <input type="file" id="imageUpload" accept="image/*" multiple style="display: none;">
      <button type="button" class="upload-btn" onclick="document.getElementById('imageUpload').click();">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        เลือกรูปภาพอัปโหลด
      </button>
      <div id="fileList" class="file-list"></div>
    </div>

    <button type="submit" id="submitBtn">ส่งรายงาน</button>
  </form>
</div>

<!-- โหลด SweetAlert2 สำหรับ Popup -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- โหลดไฟล์ตั้งค่าและสคริปต์หลัก -->
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
